[project]
name = "epub-translator"
version = "1.4.0"
description = "Translate EPUB books into paragraph-aligned bilingual editions"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "epubcheck==5.3.0",
    "openai",
]

[project.optional-dependencies]
xml = ["lxml"]
review = [
    "playwright>=1.64.0",
]

[tool.uv]
package = false
